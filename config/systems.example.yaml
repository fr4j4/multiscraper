# systems.yaml.example — declarative list of emulated systems.
#
# Systems are TRANSPORT-AGNOSTIC. They declare a `relative_path` or `full_path`
# that is resolved against `current_transport` in `config.yaml`.
#
# Rules:
#   - Each system has exactly ONE of `relative_path` or `full_path` (not both, not neither).
#   - `relative_path` is concatenated with the transport's `base_path`.
#   - `full_path` is used as-is (ignores `base_path`).
#   - `extensions` is REQUIRED. Use ["*"] for wildcard, or a list like [gba, gb].
#     Leading dot is optional: "gba" and ".gba" are equivalent.
#
# If es_systems.cfg is present (auto-discovered), it can provide defaults that
# are overridden by entries in this file.

systems:
  - name: snes
    relative_path: /snes
    extensions: [sfc, smc]

  - name: gba
    relative_path: /gba
    extensions: [gba]

  - name: psx
    full_path: /mnt/external/roms/psx
    extensions: [cue, bin, iso]
